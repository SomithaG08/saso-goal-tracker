<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saso's Goal Tracker</title>
<meta name="description" content="Daily to yearly goals, streaks, reflections and daily learning.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F6F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saso's Goal Tracker">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app; period tabs on top, content cards over an optional photo, fixed bottom nav. */
:root{
  --bg:#F6F4FA; --surface:rgba(255,255,255,.86); --surface-solid:#FFFFFF; --ink:#2B2838; --muted:#6E6A80; --line:#E6E2F0;
  --accent:#6A5BD0; --accent-ink:#FFFFFF; --accent-soft:#ECE8FB;
  --p-D:#CDEBDD; --p-W:#CFE1F6; --p-M:#F8DCCF; --p-Q:#F4E8B5; --p-Y:#E3DAF7;
  --p-D-ink:#2F6B52; --p-W-ink:#2F5687; --p-M-ink:#8A4A31; --p-Q-ink:#7A6414; --p-Y-ink:#5A44A6;
  --streak:#C9733A; --danger:#C2465A; --warn-bg:#FFF4D6; --warn-ink:#7A5A00;
  --shadow:0 1px 2px rgba(43,40,56,.05),0 6px 20px rgba(43,40,56,.06);
  --f-display:"Quicksand","Nunito Sans",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161D; --surface:rgba(34,32,44,.86); --surface-solid:#22202C; --ink:#EEECF6; --muted:#A6A2B8; --line:#353244;
  --accent:#B3A8F5; --accent-ink:#1B1830; --accent-soft:#2D2943;
  --p-D:#264336; --p-W:#253A55; --p-M:#4A3127; --p-Q:#463D1C; --p-Y:#352C52;
  --p-D-ink:#A9E3C8; --p-W-ink:#AFCDF3; --p-M-ink:#F4C2AC; --p-Q-ink:#EBD98C; --p-Y-ink:#CFC3F7;
  --streak:#F0A46A; --danger:#F08597; --warn-bg:#3A3216; --warn-ink:#F2DC8F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161D; --surface:rgba(34,32,44,.86); --surface-solid:#22202C; --ink:#EEECF6; --muted:#A6A2B8; --line:#353244;
  --accent:#B3A8F5; --accent-ink:#1B1830; --accent-soft:#2D2943;
  --p-D:#264336; --p-W:#253A55; --p-M:#4A3127; --p-Q:#463D1C; --p-Y:#352C52;
  --p-D-ink:#A9E3C8; --p-W-ink:#AFCDF3; --p-M-ink:#F4C2AC; --p-Q-ink:#EBD98C; --p-Y-ink:#CFC3F7;
  --streak:#F0A46A; --danger:#F08597; --warn-bg:#3A3216; --warn-ink:#F2DC8F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.35}
.app{max-width:560px;margin:0 auto;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:26px;line-height:1.15}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.iconbtn svg{width:20px;height:20px}

.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.card h2{font-size:17px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--surface);padding:5px;border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:13px}
.tab small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.tab[aria-selected="true"]{background:var(--pc);color:var(--pi)}
.tab[aria-selected="true"] small{color:var(--pi)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.summary{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex:none}
.ring .trk{stroke:var(--line)} .ring .val{stroke:var(--pi);transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink);font-family:var(--f-mono);font-size:17px}
.summary .big{font-family:var(--f-display);font-size:20px;font-weight:700}
.summary .meta{color:var(--muted);font-size:13px}

.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.banner svg{width:18px;height:18px;flex:none}

.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface-solid);display:grid;place-items:center;flex:none;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-checked="true"]{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent));color:var(--pi,var(--accent-ink))}
.check[aria-checked="true"] svg{opacity:1}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.item .tags{display:flex;gap:8px;align-items:center;margin-top:2px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cat{border-radius:6px;padding:1px 7px;background:var(--accent-soft);font-weight:600;font-size:11.5px;letter-spacing:.02em}
.streak{color:var(--streak);font-family:var(--f-mono);font-size:12px;display:inline-flex;gap:3px;align-items:center}
.streak svg{width:12px;height:12px}
.more{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.more svg{width:18px;height:18px}

.add{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:11px;width:100%;font-weight:700;color:var(--muted);margin-top:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px}

textarea,input,select{font:inherit;color:var(--ink);background:var(--surface-solid);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:84px}
.note-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}

/* goals */
.goal{border-top:1px solid var(--line);padding:12px 0}
.goal:first-child{border-top:0;padding-top:0}
.goal-head{display:flex;gap:10px;align-items:flex-start}
.goal-head .body{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ms{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ms li{display:flex;gap:10px;align-items:center;font-size:14px}
.ms .check{width:22px;height:22px;border-radius:7px}
.ms .check svg{width:13px;height:13px}
.ms li.done span{color:var(--muted);text-decoration:line-through}

/* lists */
.li-add{display:flex;gap:8px;margin-top:10px}
.li-add input{flex:1;min-width:0}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row-actions .btn{padding:8px 12px;font-size:13px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.kpi b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart .lbl{fill:var(--muted);font-family:var(--f-mono);font-size:9.5px}
.chart .line{stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.14}
.chart .dot{fill:var(--accent);stroke:var(--surface-solid);stroke-width:2}
.chart .barr{fill:var(--accent);opacity:.75}
.chart .barr.cur{opacity:1}
.prow{display:grid;grid-template-columns:84px 1fr 44px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.prow .bar{margin:0;height:10px}
.prow .bar i{background:var(--pi)}
.prow .mono{text-align:right;font-size:13px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,18,30,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface-solid);width:100%;max-width:560px;border-radius:22px 22px 0 0;box-sizing:border-box;max-height:88vh;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:19px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-actions .r{display:flex;gap:8px;margin-left:auto}
.bgprev{height:120px;border-radius:14px;background:var(--accent-soft) center/cover no-repeat;border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
/* learn */
.quote{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.4;text-wrap:pretty}
.quote.sm{font-size:15px}
.by{color:var(--muted);font-size:13px;margin-top:6px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{border:1px solid var(--line);background:var(--surface-solid);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;padding:0;font-size:16px;line-height:1}
.stepper span{font-size:12px;color:var(--muted);min-width:56px;text-align:center;font-family:var(--f-mono)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.wtype{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.wrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wrow .lang{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:6px;padding:2px 6px;background:var(--accent-soft);flex:none;min-width:22px;text-align:center}
.wrow .lang.it{background:var(--p-D);color:var(--p-D-ink)}
.wrow .lang.en{background:var(--p-W);color:var(--p-W-ink)}
.wrow .lang.fr{background:var(--p-Y);color:var(--p-Y-ink)}
.ex{font-style:italic;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools .chip{display:inline-flex;gap:6px;align-items:center}
.tools .chip svg{width:15px;height:15px}
.lesson h3{font-size:19px;margin:6px 0 6px}
.lesson p{margin:0 0 10px;max-width:65ch}
pre.code{margin:0 0 12px;background:var(--accent-soft);border-radius:12px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;white-space:pre}
.quiz{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.quiz .q{font-weight:700}
.quiz .a{background:var(--p-D);color:var(--p-D-ink);border-radius:10px;padding:8px 10px;font-weight:600}
.learned-pill{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.refl{border-top:1px solid var(--line);padding:10px 0}
.refl:first-child{border-top:0;padding-top:0}
.refl .d{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.refl .txt{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="bg"></div>
<div class="app" id="app"><div class="card"><div class="empty">Loading your goals…</div></div></div>
<nav class="bottom" aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="bgFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
const P={D:"Daily",W:"Weekly",M:"Monthly",Q:"Quarterly",Y:"Yearly"};
const PU={D:"Today",W:"This week",M:"This month",Q:"This quarter",Y:"This year"};
const SU={D:"d",W:"w",M:"mo",Q:"q",Y:"y"};
const CATS={career:"Career",productivity:"Productivity",personal:"Personal"};
const LS="goal-tracker-v1";
const STANDALONE=!window.claude;
const ic={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5.3 2 1.3 3 2.3 3C11 8 11 5 12 2z"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  tracker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  goals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>',
  lists:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 1.5-2M4 12l1 1 1.5-2M4 18l1 1 1.5-2"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg>',
  backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
  learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5z"/><path d="M12 6v13"/></svg>',
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9l-5.3 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9l-5.3 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>'
};

// ---------- daily content ----------
const QUOTES=[

race pace    -> stint lap times   (fuel, tyres, traffic)
pit strategy -> stop laps, tyres  (undercut / overcut)

{t:"Python",h:"Lists and indexing with lap times",b:"A list keeps items in order and counts positions from 0. Negative indexes count from the end, so -1 is always the last item. Slices take a range: start is included, end is not.",c:`laps = [81.2, 80.9, 82.1, 80.4, 81.8]
laps[0]     # 81.2  first lap
laps[-1]    # 81.8  last lap

min(laps)   # 80.4`,q:"What is laps[-2]?",a:"80.4, the second-to-last item."},
{t:"Python",h:"Dictionaries: instant lookups",b:"A list has to be checked item by item. A dict jumps straight to the value from its key using a hash, so lookups stay fast no matter how big it gets.",c:`teams = {"VER": "Red Bull", "LEC": "Ferrari", "NOR": "McLaren"}

teams["HAM"] = "Ferrari"  # add

{t:"Race Simulation",h:"A lap-time model per car",b:"A simulator builds each lap from parts: base pace + tyre degradation − fuel effect − track evolution + traffic penalty + random noise.",c:`def lap_time(lap, age, base=91.0, deg=0.07, fuel=0.06,
             evo=0.02, traffic=False, rng=np.random.default_rng()):
    t = base + deg*age - fuel*lap - evo*lap
    if traffic:
        t += 0.5
    return t + rng.normal(0, 0.25)`,q:"Which term makes laps faster as the race goes on?",a:"The fuel (and track evolution) term."},
{t:"Race Simulation",h:"Monte Carlo with safety cars",b:"Run the race thousands of times with random events and compare the average outcome of each strategy, not one lucky run.",c:`rng = np.random.default_rng(42)
p_sc, runs = 0.012, 10_000          # SC chance per lap
def pit_cost(flexible):
    sc = rng.random(57) < p_sc
    if flexible and sc[15:40].any():
        return 11.0                  # cheap stop under SC
    return 22.0
fixed = np.mean([pit_cost(False) for _ in range(runs)])   # 22.0
flex  = np.mean([pit_cost(True)  for _ in range(runs)])   # ≈ 19`,q:"Why run 10,000 races instead of one?",a:"One run is luck; many runs give the expected result and its spread."},

      <button class="chip" data-act="saveWord" data-k="${esc(w[0])}" aria-pressed="${saved}">${saved?ic.starOn+"Saved":ic.star+"Save word"}</button>

    ${l.q?`<div class="quiz"><div class="eyebrow">Check yourself</div><div class="q">${esc(l.q)}</div>

    <div class="tools"><button class="${done?"btn ghost":"btn"}" data-act="learned" data-k="${esc(l.id)}">${done?"Learned ✓ (tap to undo)":"Mark as learned"}</button></div></div>`;
  return head+yours+qc+wc+lc;
}
function vGoals(){
  const gs=state.goals.filter(g=>ui.gcat==="all"||g.cat===ui.gcat);
  const today=dayStart(new Date());
  const body=gs.length?gs.map(g=>{const t=g.milestones.length,dn=g.milestones.filter(m=>m.done).length,pct=t?Math.round(100*dn/t):0;
    let due="";if(g.deadline){const dl=Math.round((parse(g.deadline)-today)/864e5);due=` · Due ${shortDate(parse(g.deadline))} · <span class="mono">${dl>=0?dl+" days left":Math.abs(dl)+" days overdue"}</span>`}
    return `<div class="goal"><div class="goal-head"><div class="body"><div class="t" style="font-weight:700">${esc(g.title)}</div>
      <div class="tags" style="font-size:12px;color:var(--muted);margin-top:2px"><span class="cat">${CATS[g.cat]||"Other"}</span>${due}</div></div>
      <button class="more" data-act="editGoal" data-id="${g.id}" aria-label="Edit goal">${ic.dots}</button></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="hint mono" style="margin-top:4px">${pct}% · ${dn}/${t} milestones</div>
      ${t?`<ul class="ms">${g.milestones.map(m=>`<li class="${m.done?"done":""}"><button class="check" role="checkbox" aria-checked="${m.done}" data-act="ms" data-g="${g.id}" data-id="${m.id}" aria-label="${esc(m.t)}">${ic.check}</button><span>${esc(m.t)}</span></li>`).join("")}</ul>`:""}
    </div>`}).join(""):`<div class="empty">Big goals with a deadline go here, like "Land a data internship". Split each into milestones.</div>`;
  return catChips("gcat")+`<div class="card">${body}<button class="add" data-act="newGoal">+ Add long-term goal</button></div>`;
}

function vLists(){

function vStats(){
  const now=new Date(),todayPct=periodPct("D");
  // last 30 days
  const days=[];for(let i=29;i>=0;i--){const d=dayStart(now);d.setDate(d.getDate()-i);days.push({d,v:dayPct(d)})}
  const valid=days.filter(x=>x.v!==null);
  const wk=[];for(let i=11;i>=0;i--){const m=mondayOf(now);m.setDate(m.getDate()-7*i);let s=0,c=0;
    for(let j=0;j<7;j++){const d=new Date(m);d.setDate(d.getDate()+j);const v=dayPct(d);if(v!==null){s+=v;c++}}wk.push({m,v:c?Math.round(s/c):null})}
  const thisWeek=wk[11].v;
  const best=state.items.map(i=>({i,s:streak(i)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,5);
  const kpis=`<div class="kpis"><div class="kpi"><b>${todayPct??"–"}${todayPct!=null?"%":""}</b><span>Today</span></div>
    <div class="kpi"><b>${thisWeek??"–"}${thisWeek!=null?"%":""}</b><span>Week average</span></div>
    <div class="kpi"><b>${best[0]?best[0].s:0}</b><span>Best streak</span></div></div>`;
  // line chart
  const W=340,H=150,L=30,R=10,T=10,B=24,iw=W-L-R,ih=H-T-B;
  const x=i=>L+iw*i/29,y=v=>T+ih*(1-v/100);
  let pts=days.map((o,i)=>o.v===null?null:[x(i),y(o.v)]);
  const seg=pts.filter(Boolean);
  let line="",area="";if(seg.length){line="M"+seg.map(p=>p.join(",")).join("L");
    area=line+`L${seg[seg.length-1][0]},${y(0)}L${seg[0][0]},${y(0)}Z`}
  const last=seg[seg.length-1];
  const grid=[0,50,100].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}%</text>`).join("");
  const xl=[0,14,29].map(i=>`<text class="lbl" x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===29?"end":"middle"}">${shortDate(days[i].d)}</text>`).join("");
  const lineSvg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily completion, last 30 days">${grid}${xl}
    ${seg.length>1?`<path class="area" d="${area}"/><path class="line" d="${line}"/>`:""}${last?`<circle class="dot" cx="${last[0]}" cy="${last[1]}" r="4"/>`:""}</svg>`;
  // bars
  const bw=iw/12;const bars=wk.map((o,i)=>{const v=o.v??0;const h=ih*v/100;
    return `<rect class="barr${i===11?" cur":""}" x="${L+i*bw+bw*.18}" y="${T+ih-h}" width="${bw*.64}" height="${Math.max(h,o.v===null?0:1.5)}" rx="3"/>`}).join("");
  const bl=[0,6,11].map(i=>`<text class="lbl" x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${i===11?"This wk":shortDate(wk[i].m)}</text>`).join("");
  const barSvg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average daily completion per week, last 12 weeks">${grid}${bars}${bl}</svg>`;
  const prows=["W","M","Q","Y"].map(p=>{const v=periodPct(p);return `<div class="prow" style="${pvars(p)}"><span>${PU[p]}</span><div class="bar"><i style="width:${v??0}%"></i></div><span class="mono">${v==null?"–":v+"%"}</span></div>`}).join("");
  const streaks=best.length?`<ul class="items">${best.map(o=>`<li class="item"><div class="body"><div class="t">${esc(o.i.title)}</div><div class="tags"><span class="cat">${P[o.i.period]}</span></div></div><span class="streak" style="font-size:14px">${ic.flame}${o.s}${SU[o.i.period]}</span></li>`).join("")}</ul>`:`<div class="empty">Complete a goal two periods in a row to start a streak.</div>`;
  const note=valid.length<3?`<div class="hint" style="margin-top:6px">Graphs fill in as you check off goals each day.</div>`:"";
  return kpis+`<div class="card"><div class="card-head"><h2>Daily completion</h2><span class="hint">Last 30 days</span></div>${lineSvg}${note}</div>
    <div class="card"><div class="card-head"><h2>Weekly average</h2><span class="hint">Last 12 weeks</span></div>${barSvg}</div>
    <div class="card"><div class="card-head"><h2>Current periods</h2></div>${prows}</div>
    <div class="card"><div class="card-head"><h2>Top streaks</h2></div>${streaks}</div>`+vReflections();
}
function vReflections(){
  const now=new Date(),mk=ymd(now).slice(0,7);
  const ks=Object.keys(state.notes).filter(k=>state.notes[k]&&state.notes[k].trim()).sort().reverse();
  const month=ks.filter(k=>k.startsWith(mk)).length;
  const body=ks.length?ks.slice(0,5).map(k=>{const d=parse(k),p=dayPct(d);
    return `<div class="refl"><div class="d"><span>${d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span>${p!=null?`<span class="mono">${p}% of daily goals</span>`:""}</div><div class="txt">${esc(state.notes[k])}</div></div>`}).join("")
    :`<div class="empty">No reflections yet. Write one on the Daily tab of the Tracker.</div>`;
  return `<div class="card"><div class="card-head"><h2>Reflections</h2><span class="hint mono">${month} this month · ${now.getDate()} days</span></div>${body}
    <div class="tools">${ks.length>5?`<button class="chip" data-act="pastNotes">All reflections (${ks.length})</button>`:""}${state.notes[ymd(now)]?"":`<button class="chip" data-act="writeNote">Write today's reflection</button>`}</div></div>`;
}

    <div class="sheet-actions">${l?`<button class="btn danger${ui.armed?" armed":""}" data-act="del">${ui.armed?"Tap again to delete":"Delete list"}</button>`:""}<div class="r"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveList">Save</button></div></div>`}

// ---------- actions ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  const segb=e.target.closest(".seg button");
  if(segb){const name=segb.parentElement.dataset.seg;keepFields();ui.sheet[name]=segb.dataset.v;renderSheet();return}
  if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="overlay"&&e.target!==b)return;
  if(!state&&a!=="nav")return;
  switch(a){
    case "nav":ui.tab=b.dataset.k;render();scrollTo(0,0);break;
    case "period":ui.period=b.dataset.k;render();break;
    case "cat":ui[b.dataset.key]=b.dataset.k;render();break;
    case "toggle":{const it=state.items.find(i=>i.id===id);const k=keyFor(it.period,new Date());const r=state.history[k]||{done:[],total:0};
      r.done=r.done.includes(id)?r.done.filter(x=>x!==id):[...r.done,id];r.total=itemsOf(it.period).length;state.history[k]=r;commit();break}
    case "newItem":openSheet({type:"item"});focusTitle();break;
    case "editItem":openSheet({type:"item",id});break;
    case "newGoal":openSheet({type:"goal"});focusTitle();break;
    case "editGoal":openSheet({type:"goal",id});break;
    case "newList":openSheet({type:"list"});focusTitle();break;
    case "editList":openSheet({type:"list",id:b.dataset.l});break;
    case "pastNotes":openSheet({type:"notes"});break;
    case "bg":openSheet({type:"bg"});break;
    case "bgPick":document.getElementById("bgFile").click();break;
    case "bgRemove":removeBg();break;
    case "overlay":case "close":closeSheet();break;
    case "saveItem":{const t=val("f-title");if(!t){toast("Give the goal a name.");return}const s=ui.sheet;
      if(s.id){const it=state.items.find(i=>i.id===s.id);const oldP=it.period;Object.assign(it,{title:t,period:s.p,cat:s.c});refreshTotals(oldP)}
      else state.items.push({id:uid(),title:t,period:s.p,cat:s.c,created:ymd(new Date())});
      refreshTotals(s.p);ui.period=s.p;closeSheet();commit();toast("Saved");break}
    case "saveGoal":{const t=val("f-title");if(!t){toast("Give the goal a name.");return}const s=ui.sheet;
      const lines=(document.getElementById("f-ms").value||"").split("\n").map(x=>x.trim()).filter(Boolean);
      const old=s.id?state.goals.find(g=>g.id===s.id):null;
      const ms=lines.map(l=>{const m=old&&old.milestones.find(x=>x.t===l);return m?{...m}:{id:uid(),t:l,done:false}});
      const g={id:s.id||uid(),title:t,deadline:val("f-dl")||"",cat:s.c,milestones:ms,created:old?old.created:ymd(new Date())};
      if(old)state.goals[state.goals.indexOf(old)]=g;else state.goals.push(g);closeSheet();commit();toast("Saved");break}
    case "saveList":{const t=val("f-title");if(!t){toast("Name the checklist.");return}const s=ui.sheet;
      if(s.id)state.lists.find(l=>l.id===s.id).name=t;else state.lists.push({id:uid(),name:t,items:[]});closeSheet();commit();break}
    case "del":{if(!ui.armed){keepFields();ui.armed=true;renderSheet();return}const s=ui.sheet;
      if(s.type==="item"){const it=state.items.find(i=>i.id===s.id);state.items=state.items.filter(i=>i.id!==s.id);refreshTotals(it.period)}
      if(s.type==="goal")state.goals=state.goals.filter(g=>g.id!==s.id);
      if(s.type==="list")state.lists=state.lists.filter(l=>l.id!==s.id);
      closeSheet();commit();toast("Deleted");break}
    case "ms":{const g=state.goals.find(x=>x.id===b.dataset.g);const m=g.milestones.find(x=>x.id===id);m.done=!m.done;commit();break}
    case "lt":{const l=state.lists.find(x=>x.id===b.dataset.l);const i=l.items.find(x=>x.id===id);i.done=!i.done;commit();break}
    case "ldel":{const l=state.lists.find(x=>x.id===b.dataset.l);l.items=l.items.filter(x=>x.id!==id);commit();break}
    case "lreset":{const l=state.lists.find(x=>x.id===b.dataset.l);l.items.forEach(i=>i.done=false);commit();break}
    case "shift":{const k=b.dataset.k;ui.off[k]=Math.max(-365,Math.min(30,ui.off[k]+Number(b.dataset.d)));if(k==="l")ui.reveal=false;render();break}
    case "reveal":ui.reveal=true;render();break;
    case "say":if(canSpeak)say(b.dataset.txt,b.dataset.lang);break;
    case "saveWord":case "unsaveWord":{const k=b.dataset.k,W=state.learned.words;
      state.learned.words=W.includes(k)?W.filter(x=>x!==k):[...W,k];commit(false);render();break}
    case "savedWords":openSheet({type:"words"});break;
    case "backup":openSheet({type:"backup"});break;
    case "exportData":{try{const blob=new Blob([JSON.stringify({app:"saso-goal-tracker",v:1,exported:new Date().toISOString(),state,bg:localBg||null})],{type:"application/json"});
      const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`saso-goal-tracker-${ymd(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
      state.lastBackup=Date.now();commit(false);renderSheet();toast("Backup downloaded")}catch(e){toast("Couldn't create the backup file.")}break}
    case "importPick":document.getElementById("importFile").click();break;
    case "importCancel":ui.sheet.pending=null;renderSheet();break;
    case "importConfirm":{const p=ui.sheet.pending;if(!p)return;state=norm(p.data.state);localBg=p.data.bg||null;
      try{if(localBg)localStorage.setItem(LS+"-bg",localBg);else localStorage.removeItem(LS+"-bg")}catch(e){}
      closeSheet();commit();toast("Backup restored");break}
    case "addWord":openSheet({type:"addWord"});setTimeout(()=>{const e=document.getElementById("w-fr");if(e)e.focus()},30);break;
    case "addQ":openSheet({type:"addQ"});setTimeout(()=>{const e=document.getElementById("q-h");if(e)e.focus()},30);break;
    case "manage":openSheet({type:"manage"});break;
    case "sync":ui._retried=false;syncNotion(false);break;
    case "saveWordNew":{const fr=val("w-fr");if(!fr){toast("Add the French word.");return}
      state.custom.words.push({id:uid(),fr,it:val("w-it"),en:val("w-en"),type:val("w-type"),ex:val("w-ex"),topic:val("w-topic"),day:dayNum(),ts:Date.now()});
      closeSheet();commit();toast("Word added. It shows up from tomorrow.");break}
    case "saveQNew":{const hh=val("q-h");if(!hh){toast("Give the question a title.");return}
      state.custom.lessons.push({id:uid(),h:hh,t:val("q-t")||"My notes",b:val("q-b"),c:(document.getElementById("q-c").value||"").replace(/\s+$/,""),q:val("q-q"),a:val("q-a"),day:dayNum(),ts:Date.now()});
      closeSheet();commit();toast("Question added. It shows up from tomorrow.");break}
    case "delWord":state.custom.words=state.custom.words.filter(w=>w.id!==id);commit(false);renderSheet();render();break;
    case "delQ":state.custom.lessons=state.custom.lessons.filter(l=>l.id!==id);commit(false);renderSheet();render();break;
    case "learned":{const k=b.dataset.k,Ls=state.learned.lessons;state.learned.lessons=Ls.includes(k)?Ls.filter(x=>x!==k):[...Ls,k];commit();break}
    case "writeNote":ui.tab="tracker";ui.period="D";render();setTimeout(()=>{const n=document.getElementById("note");if(n){n.focus();n.scrollIntoView({block:"center"})}},30);break;
  }
});
document.addEventListener("submit",e=>{const f=e.target.closest(".li-add");if(!f)return;e.preventDefault();
  const inp=f.querySelector("input");const t=inp.value.trim();if(!t)return;
  state.lists.find(l=>l.id===f.dataset.l).items.push({id:uid(),t,done:false});commit();
  const n=document.getElementById(inp.id);if(n)n.focus()});
document.addEventListener("input",e=>{if(e.target.id!=="note")return;
  state.notes[ymd(new Date())]=e.target.value;state.updated=Date.now();lsSave();
  clearTimeout(noteT);noteT=setTimeout(()=>{clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;dbSave()},50)},900)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.sheet)closeSheet()});
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
function keepFields(){const s=ui.sheet;if(!s)return;sheetRoot.querySelectorAll("input[id],textarea[id]").forEach(e=>{s["_"+e.id]=e.value})}
const _rs=renderSheet;renderSheet=function(){const s=ui.sheet;_rs();if(!s)return;sheetRoot.querySelectorAll("input[id],textarea[id]").forEach(e=>{if(s["_"+e.id]!==undefined)e.value=s["_"+e.id]})};
function focusTitle(){setTimeout(()=>{const e=document.getElementById("f-title");if(e)e.focus()},30)}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);
    if(d&&d.app==="saso-goal-tracker"&&d.state&&Array.isArray(d.state.items)){if(!ui.sheet||ui.sheet.type!=="backup")openSheet({type:"backup"});ui.sheet.pending={data:d,date:(d.exported||"").slice(0,10)};renderSheet()}
    else toast("That file isn't a Goal Tracker backup.")}catch(err){toast("That file isn't a Goal Tracker backup.")}};fr.readAsText(f)});
// ---------- background photo ----------
document.getElementById("bgFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{
    const blob=await shrink(f);
    if(assets){const r=await assets.upload(blob);
      const old=state.bg&&state.bg.id;state.bg={id:r.id,url:r.url};commit();
      if(old)assets.delete(old).catch(()=>{});
    }else{const url=await toDataURL(blob);localBg=url;try{localStorage.setItem(LS+"-bg",url)}catch(_){toast("Photo too large to keep on this device.")}render()}
    closeSheet();toast("Background updated");
  }catch(err){toast("Couldn't use that photo. Try a JPG or PNG.")}
});
function removeBg(){const old=state.bg&&state.bg.id;state.bg=null;localBg=null;try{localStorage.removeItem(LS+"-bg")}catch(e){}
  if(old&&assets)assets.delete(old).catch(()=>{});closeSheet();commit()}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
function toDataURL(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}

// ---------- midnight reset tick ----------
let lastKey=keyFor("D",new Date());
setInterval(()=>{const k=keyFor("D",new Date());
  if(k!==lastKey){lastKey=k;if(state){["D","W","M","Q","Y"].forEach(p=>{if(!state.history[keyFor(p,new Date())]&&itemsOf(p).length)state.history[keyFor(p,new Date())]={done:[],total:itemsOf(p).length}});commit()}}
  else if(state&&!ui.sheet&&document.activeElement?.id!=="note"&&!document.activeElement?.closest?.(".li-add"))render();
},30000);

// ---------- boot ----------
state=norm(lsLoad());
render();
if(!state){state=null}
(async()=>{
  let db=null,user=null;
  try{[db,user,assets]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user"),window.claude?.use?.("assets")])}catch(e){}
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(db&&id){
    try{ref=db.doc("data/users/"+id+"/tracker")}catch(e){ref=null}
  }
  if(!ref){sync="local";if(!state)state=blank();render();if(STANDALONE)setTimeout(()=>syncNotion(true),600);return}
  sync="cloud";
  setTimeout(async()=>{try{const perm=await window.claude?.use?.("permissions");const st=perm?await perm.state("mcp:Notion").catch(()=>"unavailable"):"unavailable";if(st==="granted"&&state)syncNotion(true)}catch(e){}},2500);
  let first=true;
  ref.onSnapshot(snap=>{
    if(saveT)return;
    if(snap.exists){const remote=snap.data();
      if(!state||(remote.updated||0)>=(state.updated||0)){state=norm(JSON.parse(JSON.stringify(remote)));lsSave();
        if(document.activeElement?.id==="note"&&!first)return;render()}
    }else if(first){if(state)dbSave();else{state=blank();render()}}
    first=false;
  },()=>{sync="local";if(!state)state=blank();render()});
  setTimeout(()=>{if(!state){state=blank();render()}},10000);
})();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}</script>
</body>
